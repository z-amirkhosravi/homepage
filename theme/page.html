<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{description}}">
<title>{{title}} · Math 2.0</title>
<link rel="preload" href="{{root}}assets/theme/fonts/LibertinusSerif-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{root}}assets/theme/fonts/LibertinusMath-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{root}}assets/theme/temml.css?v=12">
<link rel="stylesheet" href="{{root}}assets/theme/wiki.css?v=12">
<script defer src="{{root}}assets/theme/wiki.js?v=12"></script>
</head>
<body data-root="{{root}}">
<a class="skip-link" href="#main">Skip to content</a>
<a class="banner" href="https://z-amirkhosravi.github.io/homepage/" aria-label="Home"><img src="{{root}}assets/theme/banner.jpg" alt="Geometric constructions on five triangles: inscribed and circumscribed circles, altitudes and medians"></a>
<div class="frame">
<header class="site-header">
<nav aria-label="Sections">
<ul>
<li><a href="https://z-amirkhosravi.github.io/homepage/">About</a></li>
<li><a href="https://z-amirkhosravi.github.io/homepage/code/">Code</a></li>
<li><a href="https://z-amirkhosravi.github.io/homepage/math/" aria-current="true">Math</a></li>
</ul>
</nav>
</header>
<div class="wiki-strip">
<nav aria-label="Breadcrumb">
<ol>
<li><a href="{{root}}index.html">Wiki</a></li>
<li aria-hidden="true">/</li>
<li>{{section}}</li>
</ol>
</nav>
<div class="search" role="search">
<label class="visually-hidden" for="wiki-search">Search the wiki</label>
<input id="wiki-search" type="search" autocomplete="off" placeholder="Search statements and articles" aria-controls="search-results" aria-describedby="search-status">
<div class="search-panel" hidden>
<p id="search-status" role="status"></p>
<ul id="search-results"></ul>
</div>
</div>
</div>
<div class="wiki-body">
<details class="toc" open>
<summary>On this page</summary>
<nav aria-label="On this page">
{{toc}}
</nav>
</details>
<main id="main">
<div class="page-head">{{notice}}</div>
<div class="page-intro">
<p class="page-description">{{description}}</p>
{{controls}}
</div>
<article>
{{article}}
</article>
<script>(function(){var a=document.querySelector('main article'),h=a&&a.querySelector('h1'),i=document.querySelector('.page-intro');if(h&&i)h.after(i);})();</script>
{{adjacent}}
</main>
</div>
</div>
<footer class="site-footer">
<a href="{{root}}about.html">About this wiki</a>
</footer>
</body>
</html>
